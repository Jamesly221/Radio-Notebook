name: Test and build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python main.py --smoke-test
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_windows.py
      - run: |
          $p = Start-Process -FilePath '.\dist\Radio-Notebook\Radio-Notebook.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Radio-Notebook-Windows
          path: dist/Radio-Notebook/
          retention-days: 30
